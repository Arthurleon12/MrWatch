# Every push and pull request has to pass the same four gates the app is
# built on: lint, types, tests, production build.
#
# The build step doubles as a typecheck (`tsc -b`) and as the guard that
# refuses to bundle a credential that isn't a real TMDB key (vite.config.ts).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions are pinned to a commit, not a tag that can be moved;
      # Dependabot keeps the pins current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: the lockfile is the contract, and it also sidesteps
      # npm's optional-dependency bug that leaves oxlint without its binary
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Known vulnerabilities in what ships to users
        run: npm audit --omit=dev --audit-level=high
