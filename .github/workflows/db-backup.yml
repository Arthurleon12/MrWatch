# Weekly encrypted backup of the MrWatch database.
#
# The free Supabase tier has no automated backups — this is the safety net
# after watch history was lost to a sync bug (Aug 2026). Runs every Monday
# and on demand (Actions tab → Database backup → Run workflow).
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     — Supabase → Connect → Direct connection URI
#   BACKUP_PASSPHRASE   — any long random string; KEEP IT SOMEWHERE SAFE,
#                         without it a backup cannot be decrypted
#
# The dump is AES-encrypted before upload because this repo is public and
# artifacts on public repos are downloadable. Restore:
#   openssl enc -d -aes-256-cbc -pbkdf2 -in backup.sql.enc -out backup.sql \
#     -pass pass:<passphrase>
#   psql "$SUPABASE_DB_URL" -f backup.sql

name: Database backup

on:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client-17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Dump public schema
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set — see the header of this workflow file."
            exit 1
          fi
          pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -f backup.sql
          wc -c backup.sql

      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set — see the header of this workflow file."
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -in backup.sql -out backup.sql.enc -pass env:PASSPHRASE
          rm backup.sql

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrwatch-db-${{ github.run_number }}
          path: backup.sql.enc
          retention-days: 90
